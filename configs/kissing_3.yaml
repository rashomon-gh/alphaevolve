# Kissing number, dimension 3 (PLAN.md Phase 7). Milestone: rediscover 12.

task:
  name: kissing_3
  initial_program: ../alphaevolve/tasks/kissing/initial_program.py
  evaluator: ../alphaevolve/tasks/kissing/evaluator.py
  problem_statement_file: ../alphaevolve/tasks/kissing/context.md
  full_rewrite: false
  cpu_time_s: 200
  uses_state: true                      # best construction persists across generations
  params:
    dim: 3
    stage_budgets_s: [2.0, 20.0, 60.0]  # improve() wall budget per cascade stage
  cascade:
    - seeds: 1
      timeout_s: 30
      promote_if: {kissing_number: 1}   # stage 0: must produce something valid
    - seeds: 1
      timeout_s: 60
      promote_if: {kissing_number: 6}
    - seeds: 1
      timeout_s: 120
  features:
    - {name: code_length, bins: [1000, 1500, 2200, 3200]}
    - {name: "score:kissing_number", bins: [4, 8, 10, 11, 12]}

models_config: models.yaml
ensemble: [fast, strong]
objective: kissing_number

evolution:
  islands: 4
  migration_interval: 40
  migration_count: 2
  inspirations: 2
  seed: 0

prompting:
  slots:
    - name: change_scope
      options:
        - "Prefer a small, surgical change to the search heuristic."
        - "Feel free to restructure the whole search heuristic."
      weights: [3, 1]
  meta:
    enabled: true
    propose_every: 25
    num_snippets: 2
    seeds:
      - "Try exact lattice or polytope constructions before random search."
      - "Use repulsion dynamics to open room for one more vector."

limits:
  max_samples: 400
  max_seconds: 14400
  concurrent_generations: 4
  concurrent_evaluations: 2   # state-sharing tasks: keep eval concurrency low
  queue_size: 8

run_dir: runs
dump_every: 5
