# LLM providers and tiers. All endpoints are OpenAI-compatible; values support
# ${ENV_VAR:-default} interpolation. Override per run via the `models:` section
# of a run config, or point a tier at another model with FAST_MODEL /
# STRONG_MODEL / DEBUG_MODEL env vars. To run on the debug tier only, set
# `ensemble: [debug]` in the run config.

providers:
  # Institutional spike.tue.nl gateway — used for all tiers. Key required.
  # Models scale to zero, so the first request may sit through a cold start.
  spike:
    base_url: ${SPIKE_GATEWAY:-https://spike-gateway-runai-aiteam.inference.spike.tue.nl/v1}
    api_key_env: SPIKE_API_KEY
    timeout_s: 600

tiers:
  # Paper-style Flash/Pro mixture: ~4:1 fast:strong by sampling weight.
  # max_tokens = server-allowed maximum per model, probed 2026-08-18:
  # gemma-4-12B-it rejects above a 16384-token TOTAL context (prompt +
  # completion), so 12288 leaves ~4k prompt headroom; DeepSeek-V4-Flash
  # clamps silently (accepts 1M), so 65536 is a sane practical max;
  # Gemma-4-31B was Degraded/unprobeable — assumed to match the 12B
  # deployment, re-probe when it is healthy.
  fast:
    provider: spike
    model: ${FAST_MODEL:-Gemma-4-31B-IT-NVFP4}
    weight: 4
    temperature: 0.9
    max_tokens: 12288
  strong:
    provider: spike
    model: ${STRONG_MODEL:-DeepSeek-V4-Flash-0731}
    weight: 1
    temperature: 0.7
    max_tokens: 65536
  debug:
    provider: spike
    model: ${DEBUG_MODEL:-gemma-4-12B-it}
    weight: 1
    temperature: 0.9
    max_tokens: 12288
