# ⟨2,2,2⟩ matmul tensor decomposition (PLAN.md Phase 6). Milestone: rediscover
# Strassen's rank 7 starting from the naive Adam optimizer.

task:
  name: matmul_222
  initial_program: ../alphaevolve/tasks/matmul/initial_program.py
  evaluator: ../alphaevolve/tasks/matmul/evaluator.py
  problem_statement_file: ../alphaevolve/tasks/matmul/context.md
  full_rewrite: false
  cpu_time_s: 900
  params:
    m: 2
    n: 2
    p: 2
    start_rank: 8
    min_rank: 6            # rank 7 is optimal; 6 must stay unreachable
    stage_budgets: [[1, 150], [2, 1500], [4, 6000]]   # [seeds, iters] per stage
  cascade:
    - seeds: 1
      timeout_s: 60
      promote_if: {neg_final_loss: -2.0}   # filter broken/NaN optimizers cheaply
    - seeds: 1
      timeout_s: 300
      promote_if: {neg_final_loss: -0.5}
    - seeds: 1
      timeout_s: 900
  features:
    - {name: code_length, bins: [1200, 1800, 2600, 4000]}
    - {name: "score:neg_final_loss", bins: [-2.0, -1.0, -0.5, -0.1, -0.01]}

models_config: models.yaml
ensemble: [fast, strong]
objective: neg_best_rank

evolution:
  islands: 4
  migration_interval: 40
  migration_count: 2
  inspirations: 2
  seed: 0

prompting:
  slots:
    - name: change_scope
      options:
        - "Prefer a small, surgical change to the optimizer."
        - "Feel free to restructure the whole optimizer body."
      weights: [3, 1]
  meta:
    enabled: true
    propose_every: 25
    num_snippets: 2
    seeds:
      - "Pull factor entries toward the half-integer grid before the final rounding."
      - "Warm-start lower ranks from a found solution with one column dropped."

limits:
  max_samples: 500
  max_seconds: 14400
  concurrent_generations: 4
  concurrent_evaluations: 4
  queue_size: 8

run_dir: runs
dump_every: 5
