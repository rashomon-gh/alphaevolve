# Circle packing, n=26, maximize sum of radii (PLAN.md Phase 7, App. B.12).
# Paper reference: 2.635.

task:
  name: packing_26
  initial_program: ../alphaevolve/tasks/packing/initial_program.py
  evaluator: ../alphaevolve/tasks/packing/evaluator.py
  problem_statement_file: ../alphaevolve/tasks/packing/context.md
  full_rewrite: false
  cpu_time_s: 200
  uses_state: true
  params:
    n_circles: 26
    stage_budgets_s: [2.0, 20.0, 60.0]
  cascade:
    - seeds: 1
      timeout_s: 30
      promote_if: {sum_radii: 0.5}     # stage 0: any sane packing beats this
    - seeds: 1
      timeout_s: 60
      promote_if: {sum_radii: 2.0}
    - seeds: 1
      timeout_s: 120
  features:
    - {name: code_length, bins: [1200, 1800, 2600, 3800]}
    - {name: "score:sum_radii", bins: [2.0, 2.3, 2.5, 2.6, 2.63]}

models_config: models.yaml
ensemble: [fast, strong]
objective: sum_radii

evolution:
  islands: 4
  migration_interval: 40
  migration_count: 2
  inspirations: 2
  seed: 0

prompting:
  slots:
    - name: change_scope
      options:
        - "Prefer a small, surgical change to the search heuristic."
        - "Feel free to restructure the whole search heuristic."
      weights: [3, 1]
  meta:
    enabled: true
    propose_every: 25
    num_snippets: 2
    seeds:
      - "Mix a few large circles with small gap-fillers instead of equal sizes."
      - "After moving centers, recompute each radius exactly from its nearest constraint."

limits:
  max_samples: 400
  max_seconds: 14400
  concurrent_generations: 4
  concurrent_evaluations: 2
  queue_size: 8

run_dir: runs
dump_every: 5
