[project]
name = "alphaevolve"
version = "0.3.0"
description = "LLM-Guided Evolutionary Coding Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "asyncio>=4.0.0",
    "einops>=0.8.1",
    "ipython>=9.9.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.0.0",
    "openai>=2.28.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaevolve"]
exclude = [
    "tests", 
    "tests/*", 
    "notebooks", 
    "notebooks/*", 
    "exported", 
    "exported/*",
    ".pytest_cache",
    ".pytest_cache/*",
    ".ruff_cache",
    ".ruff_cache/*",
    ".vscode",
    ".vscode/*",
    ".idea",
    ".idea/*",
    ".env",
    ".env.example",
]
