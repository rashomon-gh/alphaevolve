[project]
name = "alphaevolve"
version = "0.1.0"
description = "Open reimplementation of AlphaEvolve (arXiv:2506.13131): an evolutionary coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openai>=1.60",
    "pyyaml>=6.0",
]

[project.scripts]
alphaevolve = "alphaevolve.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaevolve"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["alphaevolve", "tests"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
